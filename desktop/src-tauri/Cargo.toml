[package]
name = "sy-live-desktop"
version = "0.1.0"
description = "S.Y LIVE SERVICE - technician workstation"
edition = "2021"
publish = false

[lib]
name = "sy_live_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
gethostname = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
