# Builds the Windows installers (NSIS .exe + .msi) of the technician app.
# Run manually: GitHub -> Actions -> "Windows desktop installer" -> Run workflow.
name: Windows desktop installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build -w desktop
      - uses: actions/upload-artifact@v4
        with:
          name: sy-live-service-windows
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
