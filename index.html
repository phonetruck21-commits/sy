<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>חנות VR</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe-v1.6.0.min.js"></script>
  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
</head>
<body>
  <!-- שכבת מידע למסך רגיל (מוסתרת בתוך משקף VR) -->
  <div id="hud">
    <div id="hud-title"></div>
    <div id="hud-cart">🛒 <span id="hud-count">0</span> פריטים · <span id="hud-total"></span>
      <button id="hud-pay" type="button" hidden>לתשלום</button></div>
    <div id="hud-help">
      במשקף: לחצו על כפתור <b>VR</b> למטה · כוונו עם הבקר ולחצו על ההדק · סטיק שמאלי = הליכה, סטיק ימני = סיבוב<br>
      במחשב: גררו עם העכבר כדי להסתכל, W/A/S/D להליכה, לחיצה על מוצר לפרטים
    </div>
  </div>

  <!-- חלון תשלום PayPal -->
  <div id="checkout" hidden>
    <div class="co-card" role="dialog" aria-modal="true" aria-labelledby="co-title">
      <button id="co-close" class="co-x" type="button" aria-label="סגירה">✕</button>
      <div id="co-summary">
        <h2 id="co-title">תשלום מאובטח</h2>
        <ul id="co-lines"></ul>
        <div id="co-total"></div>
        <div id="paypal-buttons"></div>
      </div>
      <div id="co-done" hidden>
        <h2>תודה! ההזמנה התקבלה 🎉</h2>
        <p id="co-done-text"></p>
        <p class="co-note">אישור נשלח אליכם במייל מ-PayPal.</p>
        <button id="co-back-vr" class="co-btn" type="button" hidden>חזרה לחנות ב-VR 🥽</button>
        <button id="co-close-done" class="co-btn co-btn-secondary" type="button">המשך קנייה</button>
      </div>
      <div id="co-status" aria-live="polite"></div>
    </div>
  </div>

  <a-scene
    store
    renderer="antialias: true; colorManagement: true"
    cursor="rayOrigin: mouse; fuse: false"
    raycaster="objects: .clickable; far: 20"
    vr-mode-ui="enabled: true"
    xr-mode-ui="enabled: true"
    loading-screen="dotsColor: #3b82f6; backgroundColor: #0f172a">

    <a-assets></a-assets>

    <!-- תאורה -->
    <a-entity light="type: ambient; intensity: 0.45; color: #ffffff"></a-entity>
    <a-entity light="type: directional; intensity: 0.7" position="2 6 3"></a-entity>
    <a-entity light="type: point; intensity: 0.6; distance: 12" position="0 3.6 0"></a-entity>

    <a-sky color="#dbeafe"></a-sky>

    <!-- השחקן: rig + מצלמה + בקרים -->
    <a-entity id="rig" position="0 0 0" thumbstick-move="speed: 2">
      <a-entity id="camera" camera position="0 1.6 0" look-controls wasd-controls="acceleration: 25">
        <a-entity id="toast" position="0 -0.3 -1.2" visible="false"></a-entity>
      </a-entity>
      <a-entity id="leftHand" laser-controls="hand: left" raycaster="objects: .clickable; far: 20; lineColor: #3b82f6; lineOpacity: 0.8"></a-entity>
      <a-entity id="rightHand" laser-controls="hand: right" raycaster="objects: .clickable; far: 20; lineColor: #3b82f6; lineOpacity: 0.8"></a-entity>
    </a-entity>

    <!-- החנות נבנית מתוך js/app.js לפי js/products.js -->
    <a-entity id="store-root"></a-entity>

    <!-- חלון פרטי מוצר / תשלום -->
    <a-entity id="panel" visible="false"></a-entity>
  </a-scene>
</body>
</html>
