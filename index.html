/* ---------- photo handling ---------- */
function compress(file,max,q){
  return new Promise(function(res,rej){
    var img=new Image(),url=URL.createObjectURL(file);
    img.onload=function(){var s=Math.min(1,max/Math.max(img.width,img.height));var c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
      if(c.toBlob)c.toBlob(function(b){b?res({blob:b,data:null,canvas:c}):res({blob:null,data:c.toDataURL("image/jpeg",q)})},"image/jpeg",q);else res({blob:null,data:c.toDataURL("image/jpeg",q)});};
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error("bad image"))};img.src=url;
  });
}
function handlePhotos(files,target){
  files=Array.from(files||[]);if(!files.length)return;
  if(target==="__sheet"&&sheetState){sheetState.files=(sheetState.files||[]).concat(files)}
  toast("מעלה "+files.length+" תמונות…");
  var chain=Promise.resolve(),added=[];
  files.forEach(function(file){chain=chain.then(function(){
    if(S.mode==="db"&&S.assets){
      return compress(file,1600,0.82).then(function(r){return S.assets.upload(r.blob||file,{type:"image/jpeg"})}).then(function(up){added.push({id:up.id,url:up.url,name:file.name,at:today()})}).catch(function(){toast("העלאת תמונה נכשלה")});
    }
    return compress(file,520,0.6).then(function(r){var d=r.data||r.canvas.toDataURL("image/jpeg",0.6);added.push({data:d,name:file.name,at:today()})}).catch(function(){toast("לא ניתן לקרוא את התמונה")});
  })});
  chain.then(function(){
    if(!added.length)return;
    if(target==="__sheet"){if(sheetState){sheetState.photos=sheetState.photos.concat(added);renderSheetPhotos()}return}
    var it=get(target);if(!it)return;it.photos=(it.photos||[]).concat(added);persist(it);toast("התמונות נשמרו");
  });
}

/* ---------- actions ---------- */
function mutate(id,fn){var it=get(id);if(!it)return;fn(it);persist(it)}
function createTpl(t){
  var p=t==="server"?tplServer():tplFarm();
  if(S.items[p.id]){location.hash="#"+t;return}
  persist(p);
  if(t==="server"&&!S.items["rem-srv"])persist(tplReminder());
  toast("הפרויקט נוצר");
}
function convertQuote(id){
  var q=get(id);if(!q)return;
  var p={id:uid(),kind:"project",template:null,name:q.title||("פרויקט "+(q.client||"")),client:q.client||"",phone:q.phone||"",domain:q.domain||"",address:q.address||"",area:q.area||"",status:"תכנון",startDate:"",dueDate:"",notes:q.notes||"",quoteId:q.id,
    checklist:[],equipment:(q.lines||[]).filter(function(l){return l.desc}).map(function(l){return{id:uid(),name:l.desc,model:"",qty:l.qty||"",status:"נדרש",supplier:"",price:"",notes:"מתוך הצעת המחיר"}}),
    specs:[],vlans:[],ports:[],photos:[],log:[{id:uid(),date:today(),text:"נוצר מהצעת מחיר"+((q.versions||[]).length?" (גרסה "+q.versions[q.versions.length-1].n+")":"")}]};
  q.status="הומרה לפרויקט";q.projectId=p.id;
  persist(p);persist(q);toast("נוצר פרויקט. הציוד סומן 'נדרש' עד שתעדכן.");location.hash="#p-"+p.id;
}

document.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-act],[data-go],[data-seg]");if(!t)return;
  if(t.hasAttribute("data-go")){ev.preventDefault();location.hash=t.getAttribute("data-go");return}
  if(t.hasAttribute("data-seg")){S.seg[t.getAttribute("data-seg")]=t.getAttribute("data-val");render();return}
  var a=t.getAttribute("data-act"),id=t.getAttribute("data-id");
  switch(a){
    case "menu":menuSheet();break;
    case "sheet-close":ev.preventDefault();closeSheet();break;
    case "sheet-close-nav":closeSheet();break;
    case "sheet-scrim":if(ev.target===t)closeSheet();break;
    case "new-job":newJob({domain:t.getAttribute("data-domain")||"",jtype:t.getAttribute("data-jtype")||""});break;
    case "edit-job":jobForm(get(id),false);break;
    case "job-status":mutate(id,function(j){j.status=t.getAttribute("data-val")});break;
    case "job-income":var j=get(id);if(j)finForm({id:uid(),kind:"finance",ftype:"הכנסה",amount:j.price,date:today(),desc:j.title||("עבודה: "+(j.client||"")),client:j.client||"",projectId:j.projectId||"",category:j.domain||""},true);break;
    case "new-quote":var q={id:uid(),kind:"quote",title:"",client:"",phone:"",domain:t.getAttribute("data-domain")||"",area:"",address:"",status:"טיוטה",lines:[{id:uid(),desc:"",qty:"1",unit:""}],notes:"",versions:[],projectId:""};quoteForm(q,true);break;
    case "edit-quote":quoteForm(get(id),false);break;
    case "q-status":mutate(id,function(q){q.status=t.getAttribute("data-val")});break;
    case "ql-add":mutate(id,function(q){q.lines=(q.lines||[]).concat([{id:uid(),desc:"",qty:"1",unit:""}])});break;
    case "ql-del":mutate(id,function(q){q.lines=(q.lines||[]).filter(function(l){return l.id!==t.getAttribute("data-l")})});break;
    case "q-save-ver":mutate(id,function(q){var vs=q.versions||[];var nn=vs.length?vs[vs.length-1].n+1:1;vs.push({n:nn,savedAt:today(),lines:clone(q.lines||[]),notes:q.notes||"",total:quoteTotal(q.lines)});q.versions=vs});toast("הגרסה נשמרה");break;
    case "q-restore":var nv=+t.getAttribute("data-n");confirmSheet("הטיוטה הנוכחית תוחלף בגרסה "+nv+". שמור קודם גרסה אם צריך.","שחזר",function(){mutate(id,function(q){var v=(q.versions||[]).filter(function(x){return x.n===nv})[0];if(v){q.lines=clone(v.lines).map(function(l){l.id=uid();return l});q.notes=v.notes}})});break;
    case "q-convert":confirmSheet("ייווצר פרויקט חדש מההצעה. שורות ההצעה יהפכו לפריטי ציוד בסטטוס 'נדרש'.","המר לפרויקט",function(){convertQuote(id)});break;
    case "new-project":projectForm({id:uid(),kind:"project",template:null,name:"",client:"",phone:"",domain:"",address:"",area:"",status:"תכנון",startDate:"",dueDate:"",notes:"",quoteId:"",checklist:[],equipment:[],specs:[],vlans:[],ports:[],photos:[],log:[]},true);break;
    case "edit-project":projectForm(get(id),false);break;
    case "p-status":mutate(id,function(p){p.status=t.getAttribute("data-val")});break;
    case "create-tpl":createTpl(t.getAttribute("data-t"));break;
    case "ck-toggle":mutate(id,function(it){it.checklist.forEach(function(c){if(c.id===t.getAttribute("data-c")){c.done=!c.done;c.doneAt=c.done?today():""}})});break;
    case "ck-elec":mutate(id,function(it){it.checklist.forEach(function(c){if(c.id===t.getAttribute("data-c"))c.elec=!c.elec})});break;
    case "ck-del":var cid=t.getAttribute("data-c");confirmSheet("למחוק את השלב?","מחק",function(){mutate(id,function(it){it.checklist=it.checklist.filter(function(c){return c.id!==cid})})});break;
    case "ph-del":var pi=+t.getAttribute("data-i");confirmSheet("להסיר את התמונה?","הסר",function(){mutate(id,function(it){var ph=it.photos.splice(pi,1)[0];if(ph&&ph.id&&S.assets){S.assets.delete(ph.id).catch(function(){})}})});break;
    case "sph-del":if(sheetState){sheetState.photos.splice(+t.getAttribute("data-i"),1);renderSheetPhotos()}break;
    case "log-del":var lid=t.getAttribute("data-l");mutate(id,function(p){p.log=(p.log||[]).filter(function(l){return l.id!==lid})});break;
    case "eq-new":equipForm(id,null);break;
    case "eq-edit":equipForm(id,t.getAttribute("data-e"));break;
    case "eq-del":var eid=t.getAttribute("data-e");closeSheet();confirmSheet("למחוק את פריט הציוד?","מחק",function(){mutate(id,function(p){p.equipment=p.equipment.filter(function(e){return e.id!==eid})})});break;
    case "port":portForm(id,+t.getAttribute("data-n"));break;
    case "vlan-add":mutate(id,function(p){p.vlans=(p.vlans||[]).concat([{id:uid(),vid:"",name:"",subnet:"",notes:""}])});break;
    case "vlan-del":var vid=t.getAttribute("data-v");confirmSheet("למחוק את שורת ה-VLAN?","מחק",function(){mutate(id,function(p){p.vlans=p.vlans.filter(function(v){return v.id!==vid})})});break;
    case "spec-add":(function(){var p=get(id);openSheet("שדה חדש",'<div class="grid2">'+field("קבוצה","group","כללי")+field("שם השדה","label","")+'</div>',function(form){var l=fval(form,"label");if(!l){toast("צריך שם שדה");return}p.specs=(p.specs||[]).concat([{id:uid(),group:fval(form,"group")||"כללי",label:l,value:""}]);persist(p);closeSheet()})})();break;
    case "new-fin":finForm({id:uid(),kind:"finance",ftype:t.getAttribute("data-t"),amount:"",date:today(),desc:"",client:"",projectId:"",category:""},true);break;
    case "edit-fin":finForm(get(id),false);break;
    case "new-sup":supForm({id:uid(),kind:"supplier",name:"",category:"",contact:"",phone:"",notes:""},true);break;
    case "edit-sup":supForm(get(id),false);break;
    case "new-rem":remForm({id:uid(),kind:"reminder",title:"",every:"חודשי",due:"",projectId:"",notes:"",lastDone:"",history:[],checklist:[]},true);break;
    case "edit-rem":remForm(get(id),false);break;
    case "rem-done":mutate(id,function(r){var td=today();r.lastDone=td;r.history=(r.history||[]).concat([td]);(r.checklist||[]).forEach(function(c){c.done=false;c.doneAt=""});if(r.every==="חודשי")r.due=addMonth(r.due&&r.due>td?r.due:td)});toast("נרשם כבוצע");break;
    case "new-compare":compareForm({id:uid(),kind:"compare",title:"",projectId:"",notes:"",status:"פתוחה",chosenPartner:"",chosenEmerg:"",analysis:null},true);break;
    case "edit-compare":compareForm(get(id),false);break;
    case "del-compare":confirmSheet("למחוק את ההשוואה ואת כל ההצעות שבה? רשימת הספקים לא תימחק.","מחק",function(){all("squote").forEach(function(q){if(q.compareId===id)removeItem(q.id)});removeItem(id);location.hash="#compare";toast("נמחק")});break;
    case "sq-new":sqForm({id:uid(),kind:"squote",compareId:id,supplier:"",date:today(),validUntil:"",vatInc:"לא ידוע",shipping:"",deliveryDays:"",warrantyMonths:"",stock:"לא ידוע",emergency:"לא ידוע",payment:"",notes:"",rawText:"",lines:[],photos:[]},true);break;
    case "sq-edit":sqForm(get(id),false);break;
    case "sq-ai":sqAI();break;
    case "sl-add":readSheetLines();sheetState.lines.push({id:uid(),desc:"",qty:"1",unit:""});renderSheetLines();break;
    case "sl-del":readSheetLines();var slid=t.getAttribute("data-l");sheetState.lines=sheetState.lines.filter(function(l){return l.id!==slid});renderSheetLines();break;
    case "cmp-ai":cmpAI(id);break;
    case "req-add":reqForm(id);break;
    case "req-del":var rid=t.getAttribute("data-r");confirmSheet("למחוק את רישום הפנייה?","מחק",function(){mutate(id,function(c){c.requests=(c.requests||[]).filter(function(r){return r.id!==rid})})});break;
    case "price-new":priceForm({id:uid(),kind:"price",name:"",category:"",unit:"יח׳",cost:"",sell:"",supplier:"",notes:"",history:[]},true);break;
    case "price-edit":priceForm(get(id),false);break;
    case "sq-toprices":squoteToPrices(id);break;
    case "fc-site-add":var Fs=fastState();Fs.sites.push({id:uid(),name:"בית "+(Fs.sites.length+1),cams:"",cableM:""});saveFast();render();break;
    case "fc-site-del":var Fd=fastState();Fd.sites.splice(+t.getAttribute("data-i"),1);saveFast();render();break;
    case "fc-extra-add":var Fe=fastState();Fe.extras=(Fe.extras||[]).concat([{pid:"",qty:"1"}]);saveFast();render();break;
    case "fc-extra-del":var Fx=fastState();Fx.extras.splice(+t.getAttribute("data-i"),1);saveFast();render();break;
    case "fc-reset":confirmSheet("לנקות את הטופס של ההצעה המהירה? המחירון וההגדרות נשארים.","נקה",function(){S.fast=fastDefault();saveFast();render()});break;
    case "fc-quote":fastToQuote();break;
    case "fc-copy":var msg=fastMessage(fastCalc());try{navigator.clipboard.writeText(msg).then(function(){toast("ההודעה הועתקה. הדבק בוואטסאפ.")},function(){var ta=document.getElementById("fc-msg");if(ta){ta.focus();ta.select()}toast("סמן והעתק את הטקסט")})}catch(e){toast("סמן והעתק את הטקסט")}break;
    case "copy":var tx=t.getAttribute("data-text");try{navigator.clipboard.writeText(tx).then(function(){toast("הועתק")},function(){toast(tx)})}catch(e){toast(tx)}break;
    case "del":var back=t.getAttribute("data-back");if(sheetState)closeSheet();confirmSheet("למחוק לצמיתות? אי אפשר לבטל.","מחק",function(){removeItem(id);location.hash=back||"#home";toast("נמחק")});break;
  }
});
document.addEventListener("submit",function(ev){
  ev.preventDefault();var f=ev.target;
  if(f.id==="sheet-form"){if(sheetState&&sheetState.onSave)sheetState.onSave(f);return}
  var a=f.getAttribute("data-act"),id=f.getAttribute("data-id");var v=(f.elements.t&&f.elements.t.value||"").trim();if(!v)return;
  if(a==="ck-add"){f.elements.t.blur();mutate(id,function(it){it.checklist=(it.checklist||[]).concat([{id:uid(),text:v,done:false,elec:false,doneAt:""}])})}
  if(a==="log-add"){f.elements.t.blur();mutate(id,function(p){p.log=(p.log||[]).concat([{id:uid(),date:today(),text:v}])})}
  f.reset();
});
var filterTimer=null;
document.addEventListener("input",function(ev){
  var t=ev.target;
  if(t.hasAttribute("data-fcset")){var st0=fcSettings();st0[t.getAttribute("data-fcset")]=t.value.trim();S.items[st0.id]=st0;updateFastSummary();return}
  if((t.hasAttribute("data-fc")||t.hasAttribute("data-fcsite")||t.hasAttribute("data-fcx"))&&t.tagName!=="SELECT"){fastFromInput(t);updateFastSummary();return}
  if(t.hasAttribute("data-filter")){var k=t.closest("[data-fkey]").getAttribute("data-fkey");S.filters[k]=S.filters[k]||{};S.filters[k][t.getAttribute("data-filter")]=t.value;
    if(t.tagName==="SELECT"){render()}else{clearTimeout(filterTimer);filterTimer=setTimeout(function(){var pos=t.selectionStart,idd=t.id;render();var el=document.getElementById(idd);if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(e){}}},250)}
  }
});
document.addEventListener("change",function(ev){
  var t=ev.target;
  if(t.hasAttribute("data-photo-for")){handlePhotos(t.files,t.getAttribute("data-photo-for"));t.value="";return}
  if(t.hasAttribute("data-finmonth")){S.seg.fin=t.value;render();return}
  if(t.hasAttribute("data-qline")){mutate(t.getAttribute("data-qline"),function(q){q.lines.forEach(function(l){if(l.id===t.getAttribute("data-l"))l[t.getAttribute("data-f")]=t.value})});return}
  if(t.hasAttribute("data-qnotes")){mutate(t.getAttribute("data-qnotes"),function(q){q.notes=t.value});return}
  if(t.hasAttribute("data-eqstatus")){mutate(t.getAttribute("data-eqstatus"),function(p){p.equipment.forEach(function(e){if(e.id===t.getAttribute("data-e"))e.status=t.value})});return}
  if(t.hasAttribute("data-spec")){mutate(t.getAttribute("data-spec"),function(p){p.specs.forEach(function(s){if(s.id===t.getAttribute("data-s"))s.value=t.value.trim()})});return}
  if(t.hasAttribute("data-vlan")){mutate(t.getAttribute("data-vlan"),function(p){p.vlans.forEach(function(v){if(v.id===t.getAttribute("data-v"))v[t.getAttribute("data-f")]=t.value.trim()})});return}
  if(t.hasAttribute("data-cmpchoice")){mutate(t.getAttribute("data-cmpchoice"),function(c){c[t.getAttribute("data-f")]=t.value;if(c.status!=="העסקה הלכה למתחרה")c.status=(c.chosenPartner||c.chosenEmerg)?"הוחלט":"פתוחה"});return}
  if(t.hasAttribute("data-qlost")){mutate(t.getAttribute("data-qlost"),function(q){q.lostReason=t.value});return}
  if(t.hasAttribute("data-req")){mutate(t.getAttribute("data-req"),function(c){(c.requests||[]).forEach(function(r){if(r.id===t.getAttribute("data-r")){r[t.getAttribute("data-f")]=t.value;if(t.getAttribute("data-f")==="status"&&t.value!=="ממתין לתשובה"&&!r.answeredAt&&r.askedAt)r.answeredAt=nowLocal()}})});return}
  if(t.hasAttribute("data-fcset")){var st=fcSettings();st[t.getAttribute("data-fcset")]=t.value.trim();persist(st);updateFastSummary();return}
  if(t.hasAttribute("data-fc")||t.hasAttribute("data-fcsite")||t.hasAttribute("data-fcx")){fastFromInput(t);if(t.tagName==="SELECT")render();return}
  if(t.hasAttribute("data-remdue")){mutate(t.getAttribute("data-remdue"),function(r){r.due=t.value});return}
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&sheetState)closeSheet()});
window.addEventListener("hashchange",function(){if(sheetState)closeSheet();render();window.scrollTo(0,0)});

start();
})();
</script>
